<style>
body { font-family: sans-serif; margin: 20px; background: #fff; color: #222; }
h2 { font-size: 16px; font-weight: 500; margin-bottom: 4px; }
.controls { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
select { font-size: 13px; padding: 4px 8px; border: 0.5px solid #ccc; border-radius: 6px; }

.note { font-size: 11px; color: #999; margin-bottom: 12px; }
#heatmap-wrap { overflow-x: auto; }
.row { display: flex; align-items: center; margin-bottom: 2px; }
.row-label { width: 36px; font-size: 11px; color: #888; text-align: right; padding-right: 6px; flex-shrink: 0; }
.cells { display: flex; gap: 2px; }
.cell { width: 14px; height: 32px; border-radius: 2px; flex-shrink: 0; cursor: default; }
.label-wrap { width: 14px; flex-shrink: 0; position: relative; height: 80px; }
.label-text { position: absolute; left: 7px; top: 0; font-size: 10px; color: #888; white-space: nowrap; transform-origin: top left; transform: rotate(60deg); }

function normalize(arr){const max=Math.max(...arr);return max>0?arr.map(v=>v/max):arr.map(()=>0);}
function lerp(a,b,t){const ah=parseInt(a.slice(1),16),bh=parseInt(b.slice(1),16);const r=Math.round(((ah>>16)&255)+(((bh>>16)&255)-((ah>>16)&255))*t);const g=Math.round(((ah>>8)&255)+(((bh>>8)&255)-((ah>>8)&255))*t);const bl=Math.round((ah&255)+((bh&255)-(ah&255))*t);return "#"+[r,g,bl].map(x=>x.toString(16).padStart(2,"0")).join("");}
function toColor(norm){if(norm===0)return "#f1efe8";const stops=[[0.001,"#E6F1FB"],[0.1,"#85B7EB"],[0.3,"#378ADD"],[0.6,"#185FA5"],[1.0,"#042C53"]];for(let i=1;i<stops.length;i++){if(norm<=stops[i][0]){const t=(norm-stops[i-1][0])/(stops[i][0]-stops[i-1][0]);return lerp(stops[i-1][1],stops[i][1],t);}}return "#042C53";}
